name: DeviceScope
options:
  bundleIdPrefix: com.hmtpro
  deploymentTarget:
    iOS: "16.0"
targets:
  DeviceScope:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - sdk: CoreMotion.framework
      - sdk: Network.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: DeviceScope
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMotionUsageDescription: 用于实时显示加速度计、陀螺仪等传感器数据
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmtpro.devicescope
        PRODUCT_NAME: DeviceScope
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
