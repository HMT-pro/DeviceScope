name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project DeviceScope.xcodeproj \
            -scheme DeviceScope \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/DeviceScope.app Payload/
          zip -qry DeviceScope.ipa Payload
          ls -lh DeviceScope.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceScope-ipa
          path: DeviceScope.ipa

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DeviceScope build ${{ github.run_number }}
          files: DeviceScope.ipa
